[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Vite serves the app at the root. Existing module files under /modules/*
# remain static assets and are served before this fallback is applied.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
